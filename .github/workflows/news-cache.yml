name: Refresh Public News Metadata

on:
  schedule:
    - cron: "29 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/news-cache.yml"
      - "scripts/refreshNews.mjs"
      - "lib/newsSources.mjs"
      - "lib/newsAdapters.mjs"
      - "lib/newsContract.mjs"

permissions:
  contents: read

concurrency:
  group: pages
  queue: max
  cancel-in-progress: false

jobs:
  cache-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write
      id-token: write
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify adapters before collection
        run: npm test
      - name: Read fixed public feeds with persisted cooldowns
        id: collect
        continue-on-error: true
        run: node scripts/refreshNews.mjs
      - name: Commit only public metadata and source health
        run: |
          if ! git diff --quiet -- public/data/news.v1.json public/data/news-health.v1.json public/data/news-sources.v1.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/news.v1.json public/data/news-health.v1.json public/data/news-sources.v1.json
            git commit -m "data: refresh public news metadata and source health"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Build static command center including latest health
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy current metadata and health
        uses: actions/deploy-pages@v4
      - name: Report complete upstream failure after publishing health
        if: steps.collect.outcome == 'failure'
        run: |
          echo "No successful news retrieval. Preserved prior metadata and published failure health."
          exit 1
