name: IPS source admission probe
on:
  workflow_dispatch:
  pull_request:
    types: [opened]
    branches: [main]
    paths:
      - 'scripts/probeIpsAdmission.mjs'
      - '.github/workflows/ips-admission.yml'
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
      - run: node --test tests/ipsAdmission.test.mjs
      - name: One-time robots and metadata transport check
        run: node scripts/probeIpsAdmission.mjs
