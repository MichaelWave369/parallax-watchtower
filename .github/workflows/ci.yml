name: Watchtower Live CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    # Playwright 1.56 Chromium depends on Ubuntu 24.04; ubuntu-latest moved to 26.04.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Typecheck active Vite application
        run: npm run typecheck
      - name: Test adapters
        run: npm test
      - name: Build Vite
        run: npm run build
      - name: Install browser for real runtime smoke checks
        run: npx playwright install --with-deps chromium
      - name: Smoke test published-path page and map recovery
        run: npm run test:browser
